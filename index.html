                        <select name="from">

            </div>
<div class="dropdown">
                <div class="to">
                    <p>TO</p>

                        <img src="https://flagsapi.com/US/flat/64.png">

                        </select>
                       </div>
                </div>
</div>
<div class="msg">1USD=95INR</div>
<button type="submit" id="convert-btn">Get exchange rate</button>
                  
            </form>  
            
            
    </div>
